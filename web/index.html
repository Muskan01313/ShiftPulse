<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdf3ee" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <title>ShiftPulse</title>
    <style>
      /* The Exxat splash: shown on every open or reload, then faded out by main.tsx. */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: radial-gradient(900px 500px at 50% 45%, #ffffff 0%, #fff1ea 55%, #fde3d8 100%); transition: opacity .7s ease, visibility .7s; }
      #splash span { font: 700 clamp(72px, 15vw, 168px)/1.1 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; letter-spacing: -0.02em; background: linear-gradient(135deg, #210440, #a0446e 60%, #e5958e); -webkit-background-clip: text; background-clip: text; color: transparent; animation: splash-in .8s ease both; }
      #splash.gone { opacity: 0; visibility: hidden; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash, #splash span { transition-duration: .2s; animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><span>Exxat</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
